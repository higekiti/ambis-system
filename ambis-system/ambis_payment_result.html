<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>AMBIs お支払い</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0a1628; --navy-mid:#1a2a48; --gold:#c9a96e; --gold-light:#e8cfa0; --white:#fff; --muted:#8a9ab8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(160deg,var(--navy),var(--navy-mid));
    color:var(--white); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:440px; background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10); border-radius:18px;
    padding:44px 28px; text-align:center; backdrop-filter:blur(6px);
  }
  .logo{ font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:5px; color:var(--gold); }
  .logo span{ font-size:20px; }
  .logo-sub{ font-size:10px; letter-spacing:3px; color:var(--muted); margin-top:2px; margin-bottom:30px; }
  .logo-wrap{ margin-bottom:24px; }
  .logo-svg{ width:150px; height:auto; display:block; margin:0 auto; }
  .icon{
    width:72px; height:72px; border-radius:50%; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; font-size:38px;
  }
  .icon.ok{ background:rgba(201,169,110,0.15); color:var(--gold-light); border:2px solid var(--gold); }
  .icon.cancel{ background:rgba(255,255,255,0.06); color:var(--muted); border:2px solid rgba(255,255,255,0.2); }
  h1{ font-size:20px; font-weight:500; margin-bottom:12px; letter-spacing:1px; }
  p{ font-size:13.5px; line-height:1.9; color:#c9d3e6; margin-bottom:8px; }
  .detail{ font-size:12px; color:var(--muted); margin-top:18px; }
  .note{ font-size:12px; color:var(--muted); margin-top:22px; line-height:1.8; }
  .home{
    display:inline-block; margin-top:28px; padding:11px 26px;
    border:1px solid rgba(201,169,110,0.5); border-radius:30px;
    color:var(--gold-light); text-decoration:none; font-size:13px; letter-spacing:1px;
  }
  .home:hover{ background:rgba(201,169,110,0.10); }
</style>

<script>
  (function(){
    var params = new URLSearchParams(location.search);
    var status = params.get('status') || 'success';
    var type = params.get('type') || '';
    var TYPE_LABEL = {
      trial: '体験費', rental: 'レンタルスペース利用料',
      private_lesson: 'プライベートレッスン料', member: '月会費'
    };
    var label = TYPE_LABEL[type] || 'お支払い';
    var iconEl = document.getElementById('icon');
    var titleEl = document.getElementById('title');
    var msgEl = document.getElementById('message');
    var detailEl = document.getElementById('detail');
    var noteEl = document.getElementById('note');

    if (status === 'cancel') {
      iconEl.className = 'icon cancel';
      iconEl.textContent = '×';
      titleEl.textContent = 'お支払いがキャンセルされました';
      msgEl.textContent = '決済は完了していません。';
      noteEl.textContent = 'もう一度お支払いされる場合は、スタッフから届いたリンクを再度お開きください。';
    } else {
      iconEl.className = 'icon ok';
      iconEl.textContent = '✓';
      titleEl.textContent = 'お支払いが完了しました';
      msgEl.textContent = (label !== 'お支払い')
        ? (label + 'のお支払いを受け付けました。ありがとうございました。')
